<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background with Subtle Border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Subtle Radial Glow -->
  <circle cx="256" cy="256" r="160" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- Stylized Dumbbell / Barbell Motif -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Central Bar -->
    <rect x="136" y="240" width="240" height="32" rx="16" fill="url(#accentGrad)"/>
    <rect x="236" y="236" width="40" height="40" rx="8" fill="#f59e0b"/>

    <!-- Left Plates -->
    <rect x="100" y="186" width="36" height="140" rx="14" fill="url(#goldGrad)"/>
    <rect x="76" y="206" width="24" height="100" rx="10" fill="url(#goldGrad)" opacity="0.85"/>
    <rect x="56" y="226" width="20" height="60" rx="8" fill="url(#goldGrad)" opacity="0.7"/>

    <!-- Right Plates -->
    <rect x="376" y="186" width="36" height="140" rx="14" fill="url(#goldGrad)"/>
    <rect x="412" y="206" width="24" height="100" rx="10" fill="url(#goldGrad)" opacity="0.85"/>
    <rect x="436" y="226" width="20" height="60" rx="8" fill="url(#goldGrad)" opacity="0.7"/>
  </g>

  <!-- Energy Lightning / Star in Bottom Right -->
  <path d="M256 120 L270 160 L310 174 L270 188 L256 228 L242 188 L202 174 L242 160 Z" fill="#fbbf24" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Text Label Badge -->
  <text x="256" y="440" text-anchor="middle" fill="#f59e0b" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4">TREINO PRO</text>
</svg>
